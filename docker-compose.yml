# For development only

volumes:
  pg-database:

services:
  pg-database:
    image: postgres:14.1
    container_name: pg-database
    ports:
      - 1111:5432
    volumes:
      - pg-database:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
